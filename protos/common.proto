// common.proto — shared types used by every HAL module
//
// Source: src/lib_base.h  (TestBase, TestOutput, TestResult, MonitoringSnapshot, EventCriteria)
//
// Field-numbering rules (IMPORTANT):
//   - Field numbers start at 1 and increase monotonically.
//   - Never renumber an existing field.
//   - If a field is removed, mark it `reserved` before committing.
//   - This file is the only place where cross-module shared types live.

syntax = "proto3";

package hal.common;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";

// ============================================================
// Enumerations
// ============================================================

// Execution mode for a HAL test run.
// Maps directly to TestBase::TestMode.
enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  SINGLE_SHOT  = 1;  // ONE_SHOT  — run once, return one result
  LONG_TERM    = 2;  // LONG_TERM — run at interval for a fixed duration
  MONITORING   = 3;  // MONITORING — run at interval, collect monitor items
  EVENT_BASED  = 4;  // EVENT     — poll continuously, fire on condition
}

// Overall status reported in a ResultEnvelope.
enum TestStatus {
  TEST_STATUS_UNSPECIFIED = 0;
  PASS    = 1;  // All selected tests passed
  FAIL    = 2;  // One or more tests failed
  ERROR   = 3;  // Framework or system error prevented the run
  TIMEOUT = 4;  // Run exceeded the allowed wall-clock time
  ABORTED = 5;  // Caller invoked Stop() before completion
  PARTIAL = 6;  // Some tests passed, some failed (MONITORING / LONG_TERM)
}

// ============================================================
// Low-level test result types (mirrors lib_base.h structs)
// ============================================================

// Mirrors TestBase::TestOutput.
message TestOutput {
  bool            passed = 1;  // Whether the individual test function returned passed
  repeated string data   = 2;  // Free-form diagnostic strings (TestOutput::data)
}

// Mirrors TestBase::TestResult.
message TestResultEntry {
  string     name         = 1;  // Test function name (e.g. "testL1Cache")
  TestOutput output       = 2;
  double     duration_sec = 3;  // chrono::duration<double> cast to seconds
}

// ============================================================
// Monitoring types
// ============================================================

// Generic key-value pair used for sampled monitor data.
message KeyValuePair {
  string key   = 1;
  string value = 2;
}

// Mirrors TestBase::MonitoringSnapshot (one snapshot per cycle).
// Used as the payload inside ResultEnvelope for MONITORING mode.
message MonitoringSnapshot {
  int32                        cycle        = 1;  // 1-based cycle count
  google.protobuf.Timestamp    timestamp    = 2;  // system_clock::time_point
  repeated TestResultEntry     test_results = 3;
  repeated KeyValuePair        monitor_data = 4;  // sampled MonitorItem values
}

// ============================================================
// Configuration shared by all execution modes
// ============================================================

// Fields common to every execution mode request.
message CommonConfig {
  int32 interval_ms     = 1;  // Cycle interval in ms (LONG_TERM / MONITORING / EVENT_BASED)
  int64 duration_ms     = 2;  // Total run time ms; 0 = run until Stop() (LONG_TERM / MONITORING)
  bool  run_forever     = 3;  // If true, ignore duration_ms; run until Stop()
  int32 poll_interval_ms = 4; // Poll interval for EVENT_BASED mode
}

// Extra parameters for MONITORING mode.
// Resolution A1: MonitorItem::reader (std::function<string()>) is not serializable;
// the client sends the names of registered monitor items and the server maps them
// to their reader functions.
message MonitoringParams {
  repeated string monitor_item_names = 1;
}

// Condition specification for EVENT_BASED mode.
// Resolution A2: EventCriteria::predicate (std::function) is not serializable;
// the client sends a structured condition that the server evaluates each poll cycle.
message EventCondition {
  // Simple form: fire when the named test has the expected pass/fail result.
  string test_name     = 1;
  bool   expected_pass = 2;
  // Freeform rule string evaluated server-side when test_name is empty.
  // Example: "cpu_temp_c > 80"
  string expression    = 3;
}

// ============================================================
// Result envelope (wraps every response from HalService)
// ============================================================

// Common wrapper returned by all HalService RPCs.
// The module-specific Result message is packed into `payload` as a
// google.protobuf.Any containing hal.modules.<name>.Result.
message ResultEnvelope {
  string                    module_id      = 1;  // e.g. "cpu"
  string                    module_version = 2;  // semver string, e.g. "1.0.0"
  google.protobuf.Timestamp timestamp      = 3;
  ExecutionMode             mode           = 4;
  TestStatus                status         = 5;
  string                    error_message  = 6;
  google.protobuf.Any       payload        = 7;  // hal.modules.<name>.Result
}
