// hdmi.proto — HDMI display output testing
//
// Field-sizing rules: numbers start at 1, never renumber.

syntax = "proto3";

package hal.modules.hdmi;

import "common.proto";

// Config for the hdmi module.
// Leave test_names empty to run all available tests.
message Config {
  hal.common.CommonConfig common     = 1;
  repeated string         test_names = 2;
}

// Result for the hdmi module.
message Result {
  reserved 1, 2, 3;
  reserved "status", "message", "details";
  repeated hal.common.TestResult results = 4;
}
