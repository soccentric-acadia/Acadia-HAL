// bluetooth.proto — Bluetooth testing
//
// Field-numbering rules: numbers start at 1, never renumber.

syntax = "proto3";

package hal.modules.bluetooth;

import "common.proto";

// Config for the bluetooth module.
// Leave test_names empty to run all available tests.
message Config {
  hal.common.CommonConfig common     = 1;
  repeated string         test_names = 2;
}

// Result for the bluetooth module.
message Result {
  reserved 1, 2, 3;
  reserved "status", "message", "details";
  repeated hal.common.TestResult results = 4;
}
