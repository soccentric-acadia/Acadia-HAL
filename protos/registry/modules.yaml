# protos/registry/modules.yaml
#
# Machine-readable manifest of every HAL module exposed over the proto layer.
#
# Fields:
#   id               — wire identifier (must be unique and permanent; never reuse)
#   proto_package    — fully-qualified proto package name
#   name             — human-readable display name
#   description      — short description of the module
#   config_type_url  — type URL for the module Config message
#   result_type_url  — type URL for the module Result message
#   version          — string; increment when the proto contract changes
#   status           — "active" | "deprecated"
#   category         — functional grouping (compute/sensors/connectivity/...)
#   modes            — supported execution modes (SINGLE_SHOT/LONG_TERM/MONITORING/EVENT_BASED)
#   source_path      — repo-relative path to the C++ header this proto was derived from
#
# NOTE: for backward compatibility the older key spellings `config_type` /
# `result_type` (no `_url` suffix, no `type.googleapis.com/` prefix) are also
# accepted by the Client and Server registries, but new/updated entries should
# use `config_type_url` / `result_type_url` with the full URL prefix.
#
# Adding a module: append a new entry here and create protos/modules/<id>.proto.
# No other file needs to change.

modules:
  - id: audio_interfaces
    proto_package: hal.modules.audio_interfaces
    name: Audio Interfaces
    description: Audio Interfaces HAL validation module from src/audio_interfaces/audio_interfaces.h.
    config_type: hal.modules.audio_interfaces.Config
    result_type: hal.modules.audio_interfaces.Result
    config_type_url: type.googleapis.com/hal.modules.audio_interfaces.Config
    result_type_url: type.googleapis.com/hal.modules.audio_interfaces.Result
    version: 1
    status: active
    category: peripherals
    modes:
      - SINGLE_SHOT
      - MONITORING
      - EVENT_BASED
      - LONG_TERM
    source_path: src/audio_interfaces/audio_interfaces.h

